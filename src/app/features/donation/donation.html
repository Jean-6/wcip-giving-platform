<div class="min-h-screen flex flex-col lg:flex-row">

  <!-- GAUCHE : hero -->
  <section class="lg:w-6/12 w-full lg:h-screen lg:fixed lg:left-0 lg:top-0
                  min-h-[35vh] bg-cover bg-center relative text-white"
           style="background-image: url('/assets/images/prayer-position.jpg')">
    <div class="absolute inset-0 bg-black/65"></div>
    <div class="relative p-6 lg:p-10 h-full flex flex-col justify-between">
      <!-- Logo -->
      <div class="flex items-center gap-3">
        <img alt="Logo" class="w-20 h-20 lg:w-36 lg:h-36 object-contain"
             src="/assets/images/lfc_logo.png"/>
        <div>
          <h1 class="text-lg lg:text-2xl font-bold mb-1 uppercase">Living Faith Church</h1>
          <p class="text-xs lg:text-sm font-semibold uppercase tracking-wider opacity-80">Worldwide</p>
          <p class="text-xs lg:text-sm font-semibold uppercase tracking-wider opacity-80">International</p>
        </div>
      </div>

      <!-- Titre + boutons (cachés sur mobile pour économiser l'espace) -->
      <div class="hidden lg:block">
        <h2 class="text-3xl font-semibold leading-tight uppercase mb-8">
          Winners Chapel Intl - Paris<br/> Plateforme de dons
        </h2>
        <div class="space-y-8">
          <!-- boutons locaux -->
          <div>
            <h2 class="uppercase text-sm font-semibold py-4 tracking-wide">local</h2>
            <div class="flex gap-3 flex-wrap">
              <button type="button" (click)="selectPaymentMethod('STRIPE_CHECKOUT')"
                      [class.bg-red-600]="paymentMethod === 'STRIPE_CHECKOUT'"
                      class="btn-outline uppercase font-semibold transition">
                Paiement via Stripe
              </button>
              <button class="btn-outline uppercase border-gray-200 font-semibold opacity-50 cursor-not-allowed pointer-events-none">
                Virement bancaire
              </button>
            </div>
          </div>
          <!-- support -->
          <div>
            <h2 class="uppercase text-sm font-semibold py-1 tracking-wide">support et information</h2>
            <div class="flex gap-3 flex-wrap">
              <button (click)="openPanel('support')" class="btn-outline uppercase border-gray-200 font-semibold">Support</button>
              <button (click)="openPanel('report')" class="btn-outline uppercase border-gray-200 font-semibold">Rapport</button>
              <button (click)="openPanel('update')" class="btn-outline uppercase border-gray-200 font-semibold">Mise à jour</button>
            </div>
          </div>
        </div>
      </div>

      <div class="text-xs opacity-70 hidden lg:block">© 2026, Tous droits réservés, Winners Chapel - Paris</div>
    </div>
  </section>

  <!-- DROITE : formulaire — scrollable, décalé sur desktop -->
  <section class="w-full lg:w-6/12 lg:ml-[50%] min-h-screen bg-gray-100">

    <!-- Boutons visibles uniquement sur mobile -->
    <div class="lg:hidden bg-gray-900 text-white p-4 space-y-3">
      <div class="flex gap-2 flex-wrap">
        <button type="button" (click)="selectPaymentMethod('STRIPE_CHECKOUT')"
                [class.bg-red-600]="paymentMethod === 'STRIPE_CHECKOUT'"
                class="btn-outline text-sm uppercase font-semibold">
          Stripe
        </button>
      </div>
      <div class="flex gap-2 flex-wrap">
        <button (click)="openPanel('support')" class="btn-outline text-sm uppercase">Support</button>
        <button (click)="openPanel('report')" class="btn-outline text-sm uppercase">Rapport</button>
        <button (click)="openPanel('update')" class="btn-outline text-sm uppercase">Mise à jour</button>
      </div>
    </div>

    <!-- Formulaire -->
    <div *ngIf="!selectedPanel" class="p-6 lg:p-10 flex flex-col justify-center min-h-screen">
      <!-- ... ton formulaire existant sans changement ... -->
    </div>

    <!-- Slide panel -->
    <section *ngIf="selectedPanel" class="fixed inset-0 lg:inset-y-0 lg:right-0 lg:left-auto
                                          lg:w-6/12 w-full bg-white shadow-xl z-30
                                          flex flex-col overflow-hidden">
      <button (click)="closePanel()" class="self-end text-red-600 m-4 uppercase">✕ Fermer</button>
      <hr/>
      <div class="p-4 lg:p-6 overflow-y-auto flex-1">
        <ng-container [ngSwitch]="selectedPanel">
          <app-support-panel *ngSwitchCase="'support'"></app-support-panel>
          <app-update-panel *ngSwitchCase="'update'"></app-update-panel>
          <app-report-panel *ngSwitchCase="'report'" (submitReport)="onSubmit($event)"></app-report-panel>
        </ng-container>
      </div>
    </section>

  </section>
</div>
