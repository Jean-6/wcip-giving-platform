<div class="loader-wrap" [class.fullscreen]="fullscreen">
  <div class="loader-emblem">
    <span class="loader-ring"></span>
    <img
      src="assets/images/lfc_logo.png"
      alt="Chargement"
      class="loader-logo"
    />
  </div>
  @if (message) {
    <p class="loader-message">{{ message }}</p>
  }
</div>
